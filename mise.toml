# Project tools + tasks for Skill Tree of Life.
# Onboarding is `mise install` and you can run the game and the suite. Usage:
# `mise tasks -l` to list (local tasks only, skips global noise), `mise run test`, …
#
# msdfgen is the one thing this can't cover — no packaged Linux binary exists,
# so it stays a source build behind `mise run tools:bootstrap`, and only the
# font pipeline needs it.
[tools]
# Pinned exactly: the engine decides whether a .tscn even loads, and a project
# opened by a newer editor is not reopenable by an older one. Bump deliberately.
godot = "4.7.2-stable"
# Board tasks (.mise/tasks/gh-project) shell out to gh; auth stays in ~/.config/gh.
gh = "2"
# SCons builds the blade solver GDExtension (#798, native/). Only needed to
# (re)build that binary — the game runs fine without it, on BladeSim's GDScript
# fallback — but it lives here so `mise install` stays the whole setup.
# pipx is listed explicitly because mise's `pipx:` backend shells out to it and
# errors out of EVERY task (not just native:build) if it is missing.
pipx = "latest"
"pipx:scons" = "latest"
# The Windows cross toolchain is NOT here on purpose — see native:build below.
# The python file tasks (test, refresh, rules-hygiene, lint-transcendentals) are
# stdlib-only and want nothing newer than 3.7 — pinned so `mise install` is the
# whole setup, not because the version is delicate.
python = "3.13"

# Project board identifiers — consumed by `.mise/tasks/gh-project`.
[env]
GH_PROJECT_NUMBER = "1"
GH_PROJECT_OWNER = "@me"
GH_PROJECT_ID = "PVT_kwHOAExWR84BcS99"
# gh pages its output whenever stdout is a TTY, which hangs any agent harness
# that runs commands under a pty (opencode). Disable it repo-wide so agents can
# use plain `gh issue view <n> --comments` instead of guessing at --json fields.
GH_PAGER = "cat"

# msdfgen has no packaged Linux binary (releases ship Windows-only); the
# `tools:bootstrap` task builds it from source into this dir.
[env._]
path = "~/.local/share/mise/installs/msdfgen/1.13/bin"

# `mise install` promises to be the whole setup (CLAUDE.md), and #816 makes
# the blade solver's GDExtension mandatory — so a fresh clone needs the
# binary, not just the tools. native:fetch is deliberately non-fatal (no
# Release yet, or offline) so this hook never turns a clean install red; see
# its own comment for the degrade path.
[hooks]
postinstall = { task = "native:fetch" }

[tasks."tools:bootstrap"]
description = "Build msdfgen 1.13 from source (one-time dev tool — no packaged Linux binary exists)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
INSTALL_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/mise/installs/msdfgen/1.13/bin"
BIN="$INSTALL_DIR/msdfgen"
mkdir -p "$INSTALL_DIR"

if [ -x "$BIN" ]; then
  echo "✓ msdfgen already installed"
  exit 0
fi

for tool in cmake g++ git pkg-config; do
  command -v "$tool" >/dev/null || { echo "✗ missing build tool: $tool"; exit 1; }
done
# SVG loading needs tinyxml2; freetype + libpng are required by msdfgen's ext lib.
# Arch: yay -S tinyxml2    Debian/Ubuntu: sudo apt install libtinyxml2-dev libfreetype-dev libpng-dev
if ! pkg-config --exists tinyxml2; then
  echo "✗ missing dev lib: tinyxml2 (Arch: yay -S tinyxml2, Debian/Ubuntu: apt install libtinyxml2-dev)"
  exit 1
fi
if ! pkg-config --exists freetype2; then
  echo "✗ missing dev lib: freetype (Arch: yay -S freetype2, Debian/Ubuntu: apt install libfreetype-dev)"
  exit 1
fi
if ! pkg-config --exists libpng; then
  echo "✗ missing dev lib: libpng (Arch: yay -S libpng, Debian/Ubuntu: apt install libpng-dev)"
  exit 1
fi

BUILD_DIR="$(mktemp -d)"
trap 'rm -rf "$BUILD_DIR"' EXIT
git clone --depth 1 --branch v1.13 https://github.com/Chlumsky/msdfgen "$BUILD_DIR"
cmake -S "$BUILD_DIR" -B "$BUILD_DIR/build" -DCMAKE_BUILD_TYPE=Release \
  -DMSDFGEN_USE_VCPKG=OFF -DMSDFGEN_USE_SKIA=OFF -DMSDFGEN_USE_OPENMP=OFF
cmake --build "$BUILD_DIR/build" --parallel
cp "$BUILD_DIR/build/msdfgen" "$BIN"
echo "✓ msdfgen 1.13 → $BIN"
'''

[tasks.check]
depends = ["check-shaders", "lint-editor-hint-guard", "lint-scene-instance-depth", "lint-instanced-anchors", "lint-transcendentals"]
description = "Headless compile-check of all project scripts (Godot editor import), plus GUT hook scripts by hand — also runs check-shaders, lint-editor-hint-guard, lint-scene-instance-depth, lint-instanced-anchors and lint-transcendentals"
run = '''
#!/usr/bin/env bash
set -uo pipefail
out=$(godot --headless --editor --quit-after 400 2>&1)
if printf '%s\n' "$out" | grep -qE 'SCRIPT ERROR'; then
  printf '%s\n' "$out" | grep -E 'SCRIPT ERROR'
  echo "✗ script errors found"
  exit 1
fi

# GUT's pre_run_script/post_run_script (.gutconfig.json) are referenced only
# from that JSON, never from a scene, so the editor pass above never loads
# them — a parse error there doesn't fail here, it makes every `mise run
# test*` spin forever printing FPS instead of erroring (#737, ~10 minutes to
# diagnose the first time). Parse-check the whole directory by hand so a
# second hook script is covered without anyone remembering to add it here.
hook_failed=0
while IFS= read -r -d '' f; do
  hook_out=$(godot --headless --check-only --script "$f" 2>&1)
  if [ $? -ne 0 ]; then
    printf '%s\n' "$hook_out"
    echo "✗ parse error: $f"
    hook_failed=1
  fi
done < <(find test/gut_hooks -name '*.gd' -print0 2>/dev/null)
if [ "$hook_failed" -ne 0 ]; then
  exit 1
fi

echo "✓ all scripts compiled clean"
'''

# Shader parse errors print as `SHADER ERROR`, not `SCRIPT ERROR`, and the
# editor import pass above never compiles scene shaders — they only parse when
# something assigns them to a material (#465's watermark consts shipped broken
# through exactly that gap). check-shaders lives as a file task
# (`.mise/tasks/check-shaders`, Python like refresh/lint-transcendentals
# alongside it) because it walks the shader tree and shells out to a
# generated headless probe script — past what's readable inline here. It
# used to hardcode a two-scene probe list; #682 replaced that with a full
# `.gdshader`/`.gdshaderinc` tree walk after a shader outside both scenes
# broke and the gate stayed green.

[tasks."native:build"]
description = "Build the blade solver GDExtension (#798): `mise run native:build`, `-- template_release` for exports, `-- template_release windows` to cross-compile"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT/native"
if [ ! -f godot-cpp/SConstruct ]; then
  echo "native/godot-cpp is empty. Fetch the submodule first:" >&2
  echo "    git submodule update --init --recursive" >&2
  exit 1
fi
# template_debug is what the editor AND a headless `godot --script` / GUT run
# load; template_release is only ever loaded by an exported build.
args=(target="${1:-template_debug}")
# A second argument cross-compiles. Godot's exporter hard-fails on a declared
# but missing library (#806), so a Windows export needs the .dll to exist even
# though the game runs fine on the GDScript fallback without it.
#
# The toolchain is pinned HERE and not in [tools] because it is ~620MB — an
# order of magnitude past everything else `mise install` fetches, for a thing
# most sessions never touch. `mise exec` installs on first use, so a clone that
# only ever builds for Linux never downloads it, and the pin is still one
# version every checkout resolves rather than a distro package installed by
# hand. The empty runner for every other build means the host path pays
# nothing, not even a wrapper process.
runner=()
if [ -n "${2:-}" ]; then
  args+=(platform="$2")
  if [ "$2" = "windows" ]; then
    if [ "$(uname -s)" != "Linux" ]; then
      echo "✗ the pinned cross toolchain is a Linux build — cross-compiling for" >&2
      echo "  Windows from $(uname -s) needs a different asset in the line below." >&2
      exit 1
    fi
    # use_llvm on top of use_mingw because the toolchain is llvm-mingw: it
    # ships clang under the mingw triple names, and godot-cpp's non-llvm branch
    # reaches for `x86_64-w64-mingw32-gcc-ar`, which llvm-mingw does not have
    # (it has llvm-ar, which the llvm branch asks for). `bin_path` repeats the
    # version because mise does not glob it.
    args+=(use_mingw=yes use_llvm=yes)
    runner=(mise exec "github:mstorsjo/llvm-mingw[matching=ucrt-ubuntu-22.04-x86_64,bin_path=llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64/bin]@20260826" --)
  fi
fi
"${runner[@]}" scons "${args[@]}" -j"$(nproc)"
'''

[tasks."native:fetch"]
description = "Fetch the four blade solver binaries from the newest native-bin-* GitHub Release into native/bin/, verified + idempotent: `mise run native:fetch` (`-- --force` to overwrite a mismatching local build) (#845). Runs automatically after `mise install`; `mise run native:build` stays the from-source path."
run = '''
#!/usr/bin/env bash
set -uo pipefail
cd "$MISE_PROJECT_ROOT"
mkdir -p native/bin

force=0
if [ "${1:-}" = "--force" ]; then
  force=1
fi

# The four binaries native/blade_sim.gdextension declares as of #844 — keep
# this list in lockstep with that file's [libraries] section, and with
# native:publish below.
names=(
  libbladesim.linux.template_debug.x86_64.so
  libbladesim.linux.template_release.x86_64.so
  libbladesim.windows.template_debug.x86_64.dll
  libbladesim.windows.template_release.x86_64.dll
)

# Non-fatal from here on: no gh, no Release yet, or no network all mean "the
# game still runs" (the GDScript fallback, #798) — `mise install` must not go
# red for a machine that simply hasn't published or can't reach a Release.
if ! command -v gh >/dev/null 2>&1; then
  echo "⚠ gh CLI not found — the blade solver falls back to GDScript without" >&2
  echo "  a binary. Build from source instead: mise run native:build" >&2
  exit 0
fi

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

# Resolve the newest Release EXPLICITLY, filtered to the native-bin- tag
# family native:publish mints — never the bare "latest release" gh would
# otherwise pick. Two reasons, not one: (1) native:publish always ships a
# PRERELEASE, which gh's "latest" resolution excludes outright; (2) even
# fixed, "latest of any kind" would silently start resolving to a future
# game-version tag (v0.4, ...) the day the owner cuts one — no checksums.txt
# there, so fetch would warn-and-exit-0 forever without anyone noticing.
tag="$(gh release list --limit 50 --json tagName -q \
  '[.[] | select(.tagName | startswith("native-bin-"))][0].tagName' 2>/dev/null)"
if [ -z "$tag" ]; then
  echo "⚠ no native-bin-* GitHub Release found (or GitHub unreachable) — the" >&2
  echo "  blade solver falls back to GDScript without a binary. Build from" >&2
  echo "  source instead:" >&2
  echo "    mise run native:build" >&2
  echo "    mise run native:build -- template_debug windows   (and template_release)" >&2
  exit 0
fi

# checksums.txt (sha256sum format, written by native:publish alongside the
# four binaries) is the acceptance-2 integrity check.
if ! gh release download "$tag" --dir "$tmp" --pattern 'checksums.txt' --clobber >/dev/null 2>&1; then
  echo "⚠ Release $tag has no checksums.txt (or GitHub is unreachable) — the" >&2
  echo "  blade solver falls back to GDScript without a binary. Build from" >&2
  echo "  source instead: mise run native:build" >&2
  exit 0
fi

# MISSING files always fetch. A PRESENT-but-mismatching file is someone's
# local `native:build` (they are editing native/src/) far more often than
# it is corruption — corruption is already caught below, post-download,
# before the `mv`. Silently clobbering that local build would make #846's
# goldens fail for a reason that has nothing to do with their change, so a
# mismatch is a loud skip unless `--force` says otherwise.
want=()
for name in "${names[@]}"; do
  expected="$(awk -v n="$name" '$2 == n { print $1 }' "$tmp/checksums.txt")"
  if [ -z "$expected" ]; then
    echo "⚠ $name has no entry in the Release's checksums.txt — skipping" >&2
    continue
  fi
  if [ -f "native/bin/$name" ]; then
    actual="$(sha256sum "native/bin/$name" | awk '{print $1}')"
    if [ "$actual" = "$expected" ]; then
      continue
    fi
    if [ "$force" -ne 1 ]; then
      echo "⚠ native/bin/$name differs from Release $tag — keeping your local" >&2
      echo "  build; mise run native:fetch -- --force to replace it" >&2
      continue
    fi
  fi
  want+=("$name")
done

if [ -z "${want[*]:-}" ]; then
  echo "✓ all four binaries present and verified — nothing to fetch"
  exit 0
fi

pattern_args=()
for name in "${want[@]}"; do
  pattern_args+=(--pattern "$name")
done
if ! gh release download "$tag" --dir "$tmp" "${pattern_args[@]}" --clobber; then
  echo "✗ download failed — retry, or build from source: mise run native:build" >&2
  exit 1
fi

fail=0
for name in "${want[@]}"; do
  expected="$(awk -v n="$name" '$2 == n { print $1 }' "$tmp/checksums.txt")"
  actual="$(sha256sum "$tmp/$name" 2>/dev/null | awk '{print $1}')"
  if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
    echo "✗ checksum mismatch (or missing download) for $name — refusing to install a corrupt binary" >&2
    fail=1
    continue
  fi
  # Match native:build's own output permissions — dlopen doesn't require +x
  # on Linux, but a fetched .so/.dll should look like a built one, not read-only.
  chmod +x "$tmp/$name"
  mv "$tmp/$name" "native/bin/$name"
  echo "✓ fetched $name"
done

if [ "$fail" -ne 0 ]; then
  exit 1
fi

# A freshly-written binary is invisible to Godot until .godot/extension_list.cfg
# lists it, and .godot/ is gitignored (#845 acceptance 8; same root cause as
# blade-native.md's "refresh after the first build" for native:build). Only
# reached when we actually fetched something, so a steady-state `mise install`
# with everything already present pays nothing extra.
if ! mise run refresh >/dev/null 2>&1; then
  echo "⚠ mise run refresh failed after fetching — run it by hand before the" >&2
  echo "  extension will load: mise run refresh" >&2
fi
'''

[tasks."native:publish"]
description = "Cross-build all four blade solver binaries and publish them as a prerelease GitHub Release: `mise run native:publish -- <tag>`, tag MUST start with native-bin- (#845 — owner action, there is no CI)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag="${1:?usage: mise run native:publish -- <tag>, e.g. native-bin-2026-09-10}"
cd "$MISE_PROJECT_ROOT"

# native:fetch resolves the newest Release by filtering on this exact prefix
# (never gh's bare "latest release" — see native:fetch's own comment for why)
# so every tag this task ever mints MUST carry it, or fetch silently stops
# finding new publishes the moment something else outranks it as "latest".
case "$tag" in
  native-bin-*) ;;
  *)
    echo "✗ tag must start with native-bin- (native:fetch only looks at that" >&2
    echo "  family): got '$tag'" >&2
    exit 1
    ;;
esac

mise run native:build -- template_debug
mise run native:build -- template_release
mise run native:build -- template_debug windows
mise run native:build -- template_release windows

# Keep in lockstep with native:fetch's list and blade_sim.gdextension's
# [libraries].
names=(
  libbladesim.linux.template_debug.x86_64.so
  libbladesim.linux.template_release.x86_64.so
  libbladesim.windows.template_debug.x86_64.dll
  libbladesim.windows.template_release.x86_64.dll
)

for name in "${names[@]}"; do
  if [ ! -f "native/bin/$name" ]; then
    echo "✗ native/bin/$name did not build — aborting before publishing a partial Release" >&2
    exit 1
  fi
done

( cd native/bin && sha256sum "${names[@]}" > checksums.txt )

gh release create "$tag" \
  --prerelease \
  --title "Blade solver binaries ($tag)" \
  --notes "GDExtension binaries for native/blade_sim.gdextension (#844/#845) — linux + windows x86_64, debug + release. Fetched automatically by \`mise install\` / \`mise run native:fetch\`. See docs/domain/melee-blade-sim.md." \
  "${names[@]/#/native/bin/}" \
  native/bin/checksums.txt

echo "✓ published $tag — mise run native:fetch will pick it up as the latest release"
'''

[tasks.check-script]
description = "Parse-check a single GDScript file: `mise run check-script -- path/to.gd`"
run = "godot --headless --check-only --script"

[tasks.playground]
description = "Launch the blade/swing playground (GitHub #12)"
run = "godot --path . res://tools/blade_playground/playground.tscn"

[tasks.editor]
description = "Open the project in the Godot editor"
run = "godot --editor --path ."

[tasks.edit]
description = "Open the Godot editor: `mise run edit` (current checkout) or `mise run edit -- 31` (fuzzy-match worktree)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
query="${1:-}"
if [ -z "$query" ]; then
  godot --editor --path .
  exit 0
fi
candidates=$(git worktree list --porcelain | awk '/^worktree /{print $2}' | grep '/\.worktrees/' || true)
if [ -z "$candidates" ]; then
  echo "✗ no worktrees under .worktrees/"
  exit 1
fi
matches=$(printf '%s\n' "$candidates" | grep -i -- "$query" || true)
match_count=$(printf '%s\n' "$matches" | grep -c . || true)
if [ "$match_count" -eq 0 ]; then
  echo "✗ no worktree matches '$query'"
  exit 1
elif [ "$match_count" -eq 1 ]; then
  target="$matches"
else
  target=$(printf '%s\n' "$matches" | fzf --prompt="edit worktree> ")
  [ -n "$target" ] || { echo "✗ nothing selected"; exit 1; }
fi
echo "→ opening editor in $target"
godot --editor --path "$target"
'''

[tasks.play]
description = "Run the game"
run = "godot --path ."

# `test` itself is a file task: .mise/tasks/test — it runs GUT, keeps the full
# console output at .godot/gut-last.log, and prints a verdict instead of 7000
# lines. It also carries the -gtest/-gdir traps that used to live here.
# test:one / test:dir are kept as aliases; the script picks the right GUT flag
# from the argument (`.gd` → one script, anything else → a directory).

[tasks."test:one"]
description = "Run a single test script: `mise run test:one -- res://test/unit/test_smoke.gd`"
run = '''
#!/usr/bin/env bash
set -euo pipefail
script="${1:?usage: mise run test:one -- res://test/unit/test_smoke.gd}"
exec "${MISE_PROJECT_ROOT:-.}/.mise/tasks/test" "$script"
'''

[tasks."test:dir"]
description = "Run all tests in a directory: `mise run test:dir -- res://test/unit/`"
run = '''
#!/usr/bin/env bash
set -euo pipefail
dir="${1:?usage: mise run test:dir -- res://test/unit/}"
exec "${MISE_PROJECT_ROOT:-.}/.mise/tasks/test" "$dir"
'''

# test:timings (#624) is a pure parser of the JUnit XML `test` already writes —
# it does not invoke godot itself, so it never perturbs the suite it measures.
# Run `mise run test` (or test:one / test:dir) first, then this.
[tasks."test:timings"]
description = "Per-script GUT timings from the last run, slowest-first: `mise run test:timings`"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec "${MISE_PROJECT_ROOT:-.}/.mise/tasks/test-timings"
'''

[tasks."worktree:new"]
description = "Create a worktree: `mise run worktree:new -- 86` (issue number, fetches title) or `mise run worktree:new -- my-topic` (free text)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
arg="${1:?usage: mise run worktree:new -- <issue-number|name>}"
slugify() { echo "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40; }

if [[ "$arg" =~ ^[0-9]+$ ]]; then
  title=$(gh issue view "$arg" --json title -q .title)
  slug="issue-${arg}-$(slugify "$title")"
else
  slug="wt-$(slugify "$arg")"
fi

dir=".worktrees/${slug}"
if [ -e "$dir" ]; then
  echo "✗ worktree already exists: $dir"
  exit 1
fi

git worktree add "$dir" -b "$slug"

# native/bin/ is gitignored build output, so a fresh worktree has no compiled
# GDExtension — and the solver-parity tests then report PENDING rather than
# FAILING, which means GUT prints a GREEN verdict over the backend that ships.
# #823 was reviewed and merged on a run carrying 26 of those. Seed the binary
# so a new worktree is honest from its first `mise run test`.
#
# COPY, not a symlink, and that is load-bearing: a symlinked native/bin would
# make `mise run native:build` inside a worktree write the MAIN checkout's
# binary, and a worktree must never write there. A stale copy is cheap to
# refresh; a clobbered primary is not.
if [ -d native/bin ] && [ -n "$(ls -A native/bin 2>/dev/null)" ]; then
  mkdir -p "$dir/native/bin"
  cp -a native/bin/. "$dir/native/bin/"
  echo "✓ native binary seeded from this checkout ($(ls -1 native/bin | wc -l | tr -d ' ') file(s))"
else
  # The source checkout has nothing to copy — fall back to native:fetch (#845)
  # rather than leaving the new worktree with no binary at all. Run IN the new
  # worktree (its own mise.toml, its own $MISE_PROJECT_ROOT) so this can never
  # write the main checkout's native/bin. native:fetch prints its own reason
  # (no gh, no Release, offline) when it comes up empty, so just check whether
  # it actually left anything behind rather than duplicating that messaging.
  echo "⚠ no native binary here to seed — trying mise run native:fetch in the new worktree…"
  (cd "$dir" && mise run native:fetch) || true
  if [ ! -d "$dir/native/bin" ] || [ -z "$(ls -A "$dir/native/bin" 2>/dev/null)" ]; then
    echo "⚠ still no native binary — parity tests will skip and the suite will"
    echo "  still print green. Build it: mise run native:build"
  fi
fi

echo "✓ worktree ready: $dir (branch $slug)"
echo "  cd $dir"
'''

[tasks."worktree:ls"]
description = "List active worktrees with their branches"
run = "git worktree list"

[tasks."icons:update"]
description = "Reprocess all icon folders from game-icons.net SVGs (clone → recolor → rasterize → SDF-bake → import)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
PROJECT_ROOT="$(git -C "$SCRIPT_DIR" rev-parse --show-toplevel 2>/dev/null || echo "$PWD")"
ICONS_ROOT="$PROJECT_ROOT/assets/icons"
REPO_URL="https://github.com/game-icons/icons"
REPO_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/skill-tree-of-life/game-icons"
FG_COLOR="${GAME_ICONS_FG:-#8CD9FF}"
ICON_SIZE="${GAME_ICONS_SIZE:-256}"

# Every folder with a mapping.txt rasterizes its own icons beside the mapping
# (spells/, addons/, …). Discovered, not hardcoded — adding a folder is just
# dropping a mapping.txt next to where the PNGs should land.
shopt -s nullglob
mappings=("$ICONS_ROOT"/*/mapping.txt)
if [ ! -f "${mappings[0]}" ]; then
  echo "✗ no mapping files found under $ICONS_ROOT/*/mapping.txt"
  exit 1
fi

if ! command -v rsvg-convert &>/dev/null; then
  echo "✗ rsvg-convert not found (install librsvg)"
  exit 1
fi

# Clone / update the repo once
if [ ! -d "$REPO_DIR" ]; then
  echo "→ cloning game-icons/icons (shallow)…"
  git clone --depth 1 "$REPO_URL" "$REPO_DIR"
else
  echo "→ updating game-icons/icons…"
  git -C "$REPO_DIR" pull --ff-only 2>/dev/null || true
fi

echo "→ recoloring @ $FG_COLOR (per-folder \`#fg\` wins), rasterizing @ ${ICON_SIZE}×${ICON_SIZE}"

total=0
folders=0
for mapping in "${mappings[@]}"; do
  folders=$((folders + 1))
  dest="$(dirname "$mapping")"
  mkdir -p "$dest"
  count=0
  # A folder may pin its own foreground with a `#fg <color>` line. It exists
  # because a baked colour is one no caller can take back: `ArmedMode.icon_tint`
  # multiplies an attribute colour over the icon, and over a #8CD9FF base that
  # is a multiply of two hues. `menu/` bakes #ffffff so the pause menu keeps the
  # white it shipped with and stays steerable by modulate. Without this the
  # directive would be a comment and the next run would quietly recolour it.
  fg="$FG_COLOR"
  folder_fg=$(sed -n 's/^#fg[[:space:]]\+\(#[0-9a-fA-F]\{3,6\}\)[[:space:]]*$/\1/p' "$mapping" | head -1)
  # An `&&` chain here would be a `set -e` landmine: no directive means the
  # chain returns 1 and the task dies on the folders that DON'T pin a colour.
  if [ -n "$folder_fg" ]; then
    fg="$folder_fg"
    echo "  · $(basename "$dest")/ pins fg=$fg"
  fi
  # Third column is an OPTIONAL flags field (`flip_v` today). It exists so a
  # mirrored pair — #664's Stake/Extract arrows are one piece of art and its
  # reflection — is baked from the manifest rather than flipped at runtime:
  # the manifest stays the single source of truth and `ArmedMode.icon()` keeps
  # returning a plain Texture2D, with no presentation flag leaking into systems/.
  while IFS=$'\t' read -r name source_path flags; do
    # Skip comments and blank lines
    [[ -z "$name" || "$name" == \#* ]] && continue
    svg="$REPO_DIR/$source_path"
    if [ ! -f "$svg" ]; then
      echo "  ✗ missing: $source_path → skipping $name"
      continue
    fi
    tmp_svg="$(mktemp /tmp/icon_XXXXXX.svg)"
    # Recolor foreground, strip background rect for transparency
    sed -e "s/fill=\"#fff\"/fill=\"$fg\"/g" \
        -e 's|<path d="M0 0h512v512H0z"/>||g' \
        "$svg" > "$tmp_svg"
    # Flip in the VECTOR domain (an extra group on the fixed 512 viewBox) rather
    # than post-flipping the PNG — no raster round-trip, and no dependency on a
    # second image tool just to mirror one arrow.
    if [[ "$flags" == *flip_v* ]]; then
      sed -i -e 's|viewBox="0 0 512 512">|viewBox="0 0 512 512"><g transform="translate(0,512) scale(1,-1)">|' \
             -e 's|</svg>|</g></svg>|' "$tmp_svg"
    fi
    rsvg-convert -w "$ICON_SIZE" -h "$ICON_SIZE" "$tmp_svg" -o "$dest/${name}.png"
    rm "$tmp_svg"
    echo "  ✓ $name  ←  $source_path${flags:+  [$flags]}"
    count=$((count + 1))
  done < "$mapping"
  echo "✓ $count icons rasterized → $dest/"
  total=$((total + count))
done

echo ""
echo "✓ $total icons rasterized across $folders folder(s)"

# ── Phase 2: bake CARVE LUTs straight from the SVGs (vector SDF) ──
# tools/bake_svg_sdf.py replaces the old bake_lut() chamfer pass: msdfgen
# computes the true signed distance field from the vector paths, so the LUT
# never passes through a pixel rasterization. msdfgen is a dev tool built
# once via `mise run tools:bootstrap`; the Python post-process runs from a
# venv in the cache so the repo stays clean.
VENV_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/skill-tree-of-life/icons-venv"
if [ ! -x "$VENV_DIR/bin/python" ]; then
  echo "→ creating icon-bake venv…"
  python3 -m venv "$VENV_DIR"
  "$VENV_DIR/bin/pip" install -q numpy Pillow
fi

if ! command -v msdfgen &>/dev/null; then
  echo "→ msdfgen missing — building (one-time)…"
  mise run tools:bootstrap
fi

mkdir -p "$PROJECT_ROOT/assets/emblem_luts"
lut_total=0
for mapping in "${mappings[@]}"; do
  # `flags` (the optional third column) is read but unused here: the LUT bake
  # feeds the CARVE atlas, which is built from spells/mapping.txt only. Named
  # anyway so a three-column row's path parses instead of silently missing.
  while IFS=$'\t' read -r name source_path flags; do
    [[ -z "$name" || "$name" == \#* ]] && continue
    svg="$REPO_DIR/$source_path"
    [ -f "$svg" ] || continue
    "$VENV_DIR/bin/python" "$PROJECT_ROOT/tools/bake_svg_sdf.py" \
      "$svg" "$PROJECT_ROOT/assets/emblem_luts/${name}.png"
    lut_total=$((lut_total + 1))
  done < "$mapping"
done
echo "✓ $lut_total CARVE LUTs baked → assets/emblem_luts/"

echo "→ running godot --headless --import to regenerate .import files…"
godot --headless --import 2>&1 | grep -E "reimport|DONE|ERROR" || true
echo "✓ import complete — all UIDs regenerated"

# Pack the LUTs (baked by tools/bake_svg_sdf.py above) into the Texture2DArray
# atlas the live shader samples (#247). Lives in this task rather than a
# separate one because the atlas is downstream of the icons — splitting them
# is how the atlas goes stale against the art it's baked from.
echo ""
echo "→ baking CARVE LUTs + packing the atlas…"
cd "$PROJECT_ROOT"
godot --headless --script res://tools/bake_carve_atlas.gd
# Second import pass: the stacked atlas PNG and its generated .import only came
# into existence during the bake above, so the first pass could not have seen
# them. This is what turns it into the CompressedTexture2DArray.
godot --headless --import 2>&1 | grep -E "reimport|ERROR" || true
echo "✓ CARVE atlas packed"
'''

[tasks."worktree:rm"]
description = "Remove a worktree: `mise run worktree:rm -- 86` (fuzzy-matches dir/branch name via fzf if ambiguous)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
query="${1:?usage: mise run worktree:rm -- <fuzzy-name-or-issue-number>}"

candidates=$(git worktree list --porcelain | awk '/^worktree /{print $2}' | grep '/\.worktrees/' || true)
if [ -z "$candidates" ]; then
  echo "✗ no worktrees under .worktrees/"
  exit 1
fi

matches=$(printf '%s\n' "$candidates" | grep -i -- "$query" || true)
match_count=$(printf '%s\n' "$matches" | grep -c . || true)

if [ "$match_count" -eq 0 ]; then
  echo "✗ no worktree matches '$query'"
  exit 1
elif [ "$match_count" -eq 1 ]; then
  target="$matches"
else
  target=$(printf '%s\n' "$matches" | fzf --prompt="remove worktree> ")
  [ -n "$target" ] || { echo "✗ nothing selected"; exit 1; }
fi

branch=$(git -C "$target" branch --show-current)
git worktree remove "$target"
echo "✓ removed worktree $target"

# Only prompt when stdin is an interactive TTY — agents/scripts run this with
# stdin closed or piped, and `read` on EOF returns nonzero, which under `set -e`
# used to kill the script right after the removal above, reporting a spurious
# "task failed" for a command that had already succeeded.
if [ -t 0 ]; then
  read -r -p "Delete branch '$branch' too? [y/N] " confirm || confirm=""
  if [[ "$confirm" =~ ^[Yy]$ ]]; then
    git branch -D "$branch"
    echo "✓ deleted branch $branch"
  else
    echo "  kept branch $branch"
  fi
else
  echo "  kept branch $branch (non-interactive; pass nothing to delete it yourself: git branch -D $branch)"
fi
'''

