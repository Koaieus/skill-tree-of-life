<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @keyframes sn-ringPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes sn-ringSpin{to{transform:rotate(360deg)}}
  @keyframes sn-diskAllocate{0%{r:0;filter:brightness(1)}55%{r:23;filter:brightness(2.4)}100%{r:21;filter:brightness(1)}}
  @keyframes sn-diskDeallocate{0%{r:21;filter:brightness(1) saturate(1)}100%{r:13;filter:brightness(.4) saturate(0)}}
  @keyframes sn-shockwave{0%{r:19;opacity:.9;stroke-width:3}100%{r:41;opacity:0;stroke-width:0.5}}
  @keyframes sn-ashFall{0%{opacity:.9;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(11px) scale(.4)}}
  @keyframes sn-critFlash{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes sn-hoverGlow{0%,100%{opacity:.85}50%{opacity:1}}
</style>
</helmet>
<div style="position:relative;width:{{ size }}px;height:{{ size }}px;display:flex;align-items:center;justify-content:center;cursor:{{ cursorStyle }};" onMouseEnter="{{ onEnter }}" onMouseLeave="{{ onLeave }}" onClick="{{ onClickH }}">
  <svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" style="overflow:visible;">
    <defs>
      <radialGradient id="{{ gradId }}" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="{{ diskStops.a }}"></stop>
        <stop offset="55%" stop-color="{{ diskStops.b }}"></stop>
        <stop offset="100%" stop-color="{{ diskStops.c }}"></stop>
      </radialGradient>
      <radialGradient id="{{ gradId }}-hover" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(255,255,255,0)"></stop>
        <stop offset="62%" stop-color="rgba(255,255,255,0)"></stop>
        <stop offset="72%" stop-color="rgba(235,242,255,0.38)"></stop>
        <stop offset="100%" stop-color="rgba(235,242,255,0)"></stop>
      </radialGradient>
    </defs>

    <!-- hover: soft glow halo, NOT a stroked ring (coexists independently with the context ring) -->
    <sc-if value="{{ showContext }}" hint-placeholder-val="{{ true }}">
      <circle cx="50" cy="50" r="44" fill="url(#{{ gradId }}-hover)" opacity="{{ hoverOpacity }}" style="transition:opacity .18s ease;animation:{{ hoverAnim }};"></circle>
    </sc-if>

    <!-- context / targeting ring — floats outside the node boundary -->
    <sc-if value="{{ showContext }}" hint-placeholder-val="{{ true }}">
      <circle cx="50" cy="50" r="33.2" fill="none" stroke="{{ ctx.stroke }}" stroke-width="{{ ctx.width }}" stroke-dasharray="{{ ctx.dash }}" stroke-linecap="round" opacity="{{ ctx.opacity }}" style="transition:opacity .15s ease,stroke .15s ease;animation:{{ ctx.anim }};transform-origin:50px 50px;"></circle>
    </sc-if>

    <!-- core marker ring -->
    <circle cx="50" cy="50" r="37.5" fill="none" stroke="oklch(0.82 0.13 88)" stroke-width="1.2" opacity="{{ coreOpacity }}"></circle>

    <!-- sensed outline: fog-of-war breadcrumb, straddles the outer boundary -->
    <sc-if value="{{ sensedVisible }}" hint-placeholder-val="{{ false }}">
      <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(200,208,225,0.4)" stroke-width="1.3"></circle>
    </sc-if>

    <!-- health ring (arc) — sits in the band between the archetype border and the context ring -->
    <sc-if value="{{ healthVisible }}" hint-placeholder-val="{{ false }}">
      <circle cx="50" cy="50" r="29.6" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2.4"></circle>
      <circle cx="50" cy="50" r="29.6" fill="none" stroke="{{ hpColor }}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="186" stroke-dashoffset="{{ hpOffset }}" transform="rotate(-90 50 50)" style="filter:drop-shadow(0 0 3px {{ hpColor }});animation:{{ hpAnim }};"></circle>
    </sc-if>

    <!-- archetype border: flush with the outer boundary (inner_radius..radius) -->
    <sc-if value="{{ showArchetype }}" hint-placeholder-val="{{ true }}">
      <circle cx="50" cy="50" r="24.5" fill="none" stroke="{{ archColor }}" stroke-width="7" opacity="{{ archOpacity }}" style="filter:{{ archGlow }};transition:opacity .2s ease;"></circle>
    </sc-if>

    <!-- allocation disk (inner_radius) -->
    <sc-if value="{{ showDisk }}" hint-placeholder-val="{{ true }}">
      <circle key="{{ diskKey }}" cx="50" cy="50" r="21" fill="url(#{{ gradId }})" stroke="{{ diskRim }}" stroke-width="1.4" style="animation:{{ diskAnim }};"></circle>
    </sc-if>
    <sc-if value="{{ showGhostGlyph }}" hint-placeholder-val="{{ false }}">
      <text x="50" y="51" text-anchor="middle" dominant-baseline="middle" font-family="Cinzel" font-weight="800" font-size="17" fill="{{ archColor }}" opacity="0.16">{{ ghostGlyph }}</text>
    </sc-if>

    <!-- one-shot allocate burst -->
    <sc-if value="{{ fxAllocate }}" hint-placeholder-val="{{ false }}">
      <circle key="{{ fxKey }}" cx="50" cy="50" r="19" fill="none" stroke="{{ fxColor }}" stroke-width="3" style="animation:sn-shockwave .55s ease-out forwards;"></circle>
    </sc-if>
    <!-- one-shot deallocate ash -->
    <sc-if value="{{ fxDeallocate }}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{ ashBits }}" as="ab" hint-placeholder-count="0">
        <circle cx="{{ ab.x }}" cy="{{ ab.y }}" r="1.9" fill="{{ fxColor }}" style="animation:sn-ashFall .75s ease-in forwards;animation-delay:{{ ab.delay }}ms;transform-origin:{{ ab.x }}px {{ ab.y }}px;"></circle>
      </sc-for>
    </sc-if>
    <!-- one-shot pulse-arrival ping -->
    <sc-if value="{{ fxPulse }}" hint-placeholder-val="{{ false }}">
      <circle key="{{ pulseKey }}" cx="50" cy="50" r="19" fill="none" stroke="{{ pulseColor }}" stroke-width="3.2" style="animation:sn-shockwave .48s ease-out forwards;"></circle>
    </sc-if>

    <!-- addon badges -->
    <sc-if value="{{ showAddons }}" hint-placeholder-val="{{ true }}">
      <sc-for list="{{ addonBadges }}" as="ad" hint-placeholder-count="0">
        <line x1="{{ ad.lx1 }}" y1="{{ ad.ly1 }}" x2="{{ ad.x }}" y2="{{ ad.y }}" stroke="{{ ad.tint }}" stroke-width="1.6" opacity="0.8"></line>
        <circle cx="{{ ad.x }}" cy="{{ ad.y }}" r="7" fill="rgba(10,11,18,0.92)" stroke="{{ ad.tint }}" stroke-width="1.3" style="filter:drop-shadow(0 0 3px {{ ad.tint }});"></circle>
        <text x="{{ ad.x }}" y="{{ ad.ty }}" text-anchor="middle" dominant-baseline="middle" font-size="7.2" fill="{{ ad.tint }}">{{ ad.glyph }}</text>
      </sc-for>
    </sc-if>
  </svg>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:140},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:108,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:40,&quot;max&quot;:260},&quot;archetype&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;str&quot;,&quot;tsType&quot;:&quot;'str'|'dex'|'int'|'wis'|'per'|'con'&quot;,&quot;options&quot;:[&quot;str&quot;,&quot;dex&quot;,&quot;int&quot;,&quot;wis&quot;,&quot;per&quot;,&quot;con&quot;]},&quot;owner&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;'none'|'player'|'enemy'&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;player&quot;,&quot;enemy&quot;]},&quot;allocated&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;core&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sensed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hpPct&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:100,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:100},&quot;contextState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;'none'|'source'|'target-valid'|'target-invalid'|'threat'&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;source&quot;,&quot;target-valid&quot;,&quot;target-invalid&quot;,&quot;threat&quot;]},&quot;forceHover&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;addons&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;{kind:string}[]&quot;},&quot;showContext&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showArchetype&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showHealth&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showDisk&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showAddons&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;allocTick&quot;:{&quot;editor&quot;:null,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;dealloTick&quot;:{&quot;editor&quot;:null,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;pulseTick&quot;:{&quot;editor&quot;:null,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;onNodeClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onHoverChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:boolean) =&gt; void&quot;}}">
class Component extends DCLogic {
  ARCH = { str:'oklch(0.64 0.21 27)', dex:'oklch(0.74 0.16 150)', int:'oklch(0.68 0.18 258)', wis:'oklch(0.81 0.14 88)', per:'oklch(0.66 0.21 305)', con:'oklch(0.92 0.02 250)' };
  ARCH_LETTER = { str:'S', dex:'D', int:'I', wis:'W', per:'P', con:'C' };
  OWNER_GRAD = {
    player: { a:'oklch(0.90 0.07 220)', b:'oklch(0.68 0.13 220)', c:'oklch(0.36 0.12 225)' },
    enemy:  { a:'oklch(0.85 0.13 25)',  b:'oklch(0.60 0.20 25)',  c:'oklch(0.32 0.16 25)'  }
  };
  EMPTY_GRAD = { a:'rgba(255,255,255,0.07)', b:'rgba(32,35,46,0.92)', c:'rgba(8,9,14,0.96)' };
  // Real addon vocabulary — docs/design/skill_node_addons.md
  ADDON = {
    armor_ring:    { glyph:'⛨', tint:'oklch(0.88 0.02 250)' },
    reinforcement: { glyph:'✚', tint:'oklch(0.70 0.15 48)'  },
    buffer:        { glyph:'⇌', tint:'oklch(0.75 0.14 200)' },
    clamp:         { glyph:'⊥', tint:'oklch(0.78 0.10 75)'  },
    lifeline:      { glyph:'⟐', tint:'oklch(0.75 0.14 200)' },
    relay:         { glyph:'⇉', tint:'oklch(0.75 0.14 258)' },
    lifelink:      { glyph:'⚓', tint:'oklch(0.75 0.17 340)' },
    spikes:        { glyph:'▲', tint:'oklch(0.70 0.19 48)'  }
  };

  state = { hoverLocal:false, fx:null, fxKey:0, pulseActive:false, pulseKey:0 };
  _uid = 'sn' + Math.random().toString(36).slice(2,9);

  componentDidUpdate(prevProps){
    if (this.props.allocTick !== undefined && this.props.allocTick !== prevProps.allocTick) this._trigger('allocate');
    if (this.props.dealloTick !== undefined && this.props.dealloTick !== prevProps.dealloTick) this._trigger('deallocate');
    if (this.props.pulseTick !== undefined && this.props.pulseTick !== prevProps.pulseTick) this._triggerPulse();
  }
  componentWillUnmount(){ clearTimeout(this._fxT); clearTimeout(this._pT); }

  _trigger(kind){
    this.setState(s => ({ fx: kind, fxKey: s.fxKey + 1 }));
    clearTimeout(this._fxT);
    this._fxT = setTimeout(() => this.setState({ fx: null }), kind === 'allocate' ? 600 : 800);
  }
  _triggerPulse(){
    this.setState(s => ({ pulseActive: true, pulseKey: s.pulseKey + 1 }));
    clearTimeout(this._pT);
    this._pT = setTimeout(() => this.setState({ pulseActive: false }), 520);
  }

  polar(angleDeg, r){
    const rad = angleDeg * Math.PI / 180;
    return { x: +(50 + r * Math.cos(rad)).toFixed(2), y: +(50 + r * Math.sin(rad)).toFixed(2) };
  }

  renderVals(){
    const p = this.props;
    const size = p.size ?? 108;
    const archetype = p.archetype ?? 'str';
    const archColor = this.ARCH[archetype] || this.ARCH.str;
    const allocated = !!p.allocated;
    const owner = p.owner ?? 'none';
    const core = !!p.core;
    const hpPct = p.hpPct ?? 100;
    const critical = allocated && hpPct <= 30;

    const showContext = p.showContext ?? true;
    const showArchetype = p.showArchetype ?? true;
    const showHealth = p.showHealth ?? true;
    const showDisk = p.showDisk ?? true;
    const showAddons = p.showAddons ?? true;

    // Hover is an independent glow register (coexists with the context ring, never competes with it).
    const hoverActive = this.state.hoverLocal || !!p.forceHover;
    const hoverOpacity = hoverActive ? 1 : 0;
    const hoverAnim = hoverActive ? 'sn-hoverGlow 2.2s ease-in-out infinite' : 'none';

    const contextState = p.contextState ?? 'none';
    const CTX_MAP = {
      none:    { stroke:'transparent', width:2, dash:'none', opacity:0, anim:'none' },
      source:  { stroke:archColor, width:2.6, dash:'3 3.5', opacity:1, anim:'sn-ringSpin 5s linear infinite' },
      'target-valid':   { stroke:'oklch(0.80 0.17 150)', width:2.6, dash:'5 3', opacity:1, anim:'sn-ringPulse 1.1s ease-in-out infinite' },
      'target-invalid': { stroke:'oklch(0.66 0.20 25)', width:2, dash:'2 4', opacity:0.85, anim:'none' },
      threat:  { stroke:'oklch(0.74 0.16 55)', width:2.6, dash:'none', opacity:1, anim:'sn-ringPulse 0.75s ease-in-out infinite' }
    };
    const ctx = CTX_MAP[contextState] || CTX_MAP.none;

    // health ring
    const CIRC = 186;
    const hpColorNorm = 'oklch(0.60 0.21 25)';
    const hpColorCrit = 'oklch(0.68 0.19 30)';
    const hpColor = critical ? hpColorCrit : hpColorNorm;
    const hpOffset = (CIRC * (1 - Math.max(0, Math.min(100, hpPct)) / 100)).toFixed(2);
    const healthVisible = showHealth && allocated && (hpPct < 100 || hoverActive);
    const hpAnim = critical ? 'sn-critFlash 0.9s ease-in-out infinite' : 'none';
    const sensedVisible = !!p.sensed;

    // disk
    const grad = allocated ? (this.OWNER_GRAD[owner] || this.OWNER_GRAD.player) : this.EMPTY_GRAD;
    const diskRim = allocated ? archColor : 'rgba(255,255,255,0.12)';
    const fx = this.state.fx;
    const diskAnim = fx === 'allocate' ? 'sn-diskAllocate .55s cubic-bezier(.2,.9,.3,1) forwards'
                    : fx === 'deallocate' ? 'sn-diskDeallocate .7s ease-in forwards'
                    : 'none';
    const diskKey = 'd' + this.state.fxKey + '-' + allocated + '-' + owner;

    const showGhostGlyph = showDisk && !allocated;
    const ghostGlyph = this.ARCH_LETTER[archetype] || '?';

    // addons
    const addons = p.addons || [];
    const slots = [-58, 58, 180];
    let visible = addons.slice(0, Math.min(addons.length, 3));
    let overflow = 0;
    if (addons.length > 3) { visible = addons.slice(0, 2); overflow = addons.length - 2; }
    const addonBadges = showAddons ? visible.map((ad, i) => {
      const def = this.ADDON[ad.kind] || this.ADDON.armor_ring;
      const outer = this.polar(slots[i], 45);
      const inner = this.polar(slots[i], 28.2);
      return { x: outer.x, y: outer.y, ty: outer.y + 2.5, lx1: inner.x, ly1: inner.y, tint: def.tint, glyph: def.glyph };
    }) : [];
    if (showAddons && overflow > 0) {
      const outer = this.polar(slots[2], 45);
      const inner = this.polar(slots[2], 28.2);
      addonBadges.push({ x: outer.x, y: outer.y, ty: outer.y + 2.5, lx1: inner.x, ly1: inner.y, tint: 'rgba(200,208,225,0.7)', glyph: '+' + overflow });
    }

    const ashBits = [-17,0,17].map((dx,i) => ({ x: 50+dx, y: 68, delay: i*70 }));

    return {
      size, archColor,
      showContext, showArchetype, showHealth, showDisk, showAddons,
      ctx, coreOpacity: core ? 0.95 : 0,
      hoverOpacity, hoverAnim,
      archOpacity: allocated ? 1 : 0.4,
      archGlow: allocated ? `drop-shadow(0 0 4px ${archColor})` : 'none',
      healthVisible, hpColor, hpOffset, hpAnim, sensedVisible,
      gradId: this._uid, diskStops: grad, diskRim, diskAnim, diskKey,
      showGhostGlyph, ghostGlyph,
      fxAllocate: fx === 'allocate', fxDeallocate: fx === 'deallocate', fxColor: allocated ? (this.OWNER_GRAD[owner]||this.OWNER_GRAD.player).b : archColor, fxKey: 'k'+this.state.fxKey,
      fxPulse: this.state.pulseActive, pulseColor: archColor, pulseKey: 'p'+this.state.pulseKey,
      addonBadges, ashBits,
      cursorStyle: p.onNodeClick ? 'pointer' : 'default',
      onEnter: () => { this.setState({ hoverLocal:true }); if (p.onHoverChange) p.onHoverChange(true); },
      onLeave: () => { this.setState({ hoverLocal:false }); if (p.onHoverChange) p.onHoverChange(false); },
      onClickH: () => { if (p.onNodeClick) p.onNodeClick(); }
    };
  }
}

</script>
</body>
</html>
