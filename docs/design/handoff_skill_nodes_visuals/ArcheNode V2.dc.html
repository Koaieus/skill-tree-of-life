<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Runic&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>@keyframes archespin{to{transform:rotate(360deg);}}@keyframes archepulse{0%,100%{opacity:0.75;}50%{opacity:1;}}@keyframes archeglow{0%,100%{opacity:0.35;}50%{opacity:0.95;}}</style>
</helmet>
<div style="{{ wrapperStyle }}" onMouseEnter="{{ onEnter }}" onMouseLeave="{{ onLeave }}">
  <svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" style="overflow:visible;">
    <defs>
      <radialGradient id="{{ uid }}-d" cx="36%" cy="30%" r="72%">
        <stop offset="0%" stop-color="{{ disk.hi }}"></stop>
        <stop offset="52%" stop-color="{{ disk.mid }}"></stop>
        <stop offset="100%" stop-color="{{ disk.lo }}"></stop>
      </radialGradient>
      <radialGradient id="{{ uid }}-m" cx="38%" cy="30%" r="78%">
        <stop offset="0%" stop-color="{{ metalG.hi }}"></stop>
        <stop offset="55%" stop-color="{{ metalG.mid }}"></stop>
        <stop offset="100%" stop-color="{{ metalG.lo }}"></stop>
      </radialGradient>
      <radialGradient id="{{ uid }}-a" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="{{ aura.mid }}" stop-opacity="0.5"></stop>
        <stop offset="52%" stop-color="{{ aura.mid }}" stop-opacity="0.2"></stop>
        <stop offset="100%" stop-color="{{ aura.mid }}" stop-opacity="0"></stop>
      </radialGradient>
      <sc-for list="{{ runeMasks }}" as="rm" hint-placeholder-count="0">
        <mask id="{{ rm.id }}" maskUnits="userSpaceOnUse" x="{{ rm.boxX }}" y="{{ rm.boxX }}" width="{{ rm.boxW }}" height="{{ rm.boxW }}">
          <circle cx="50" cy="50" r="{{ rm.rOuter }}" fill="white"></circle>
          <circle cx="50" cy="50" r="{{ rm.rInner }}" fill="black"></circle>
          <sc-for list="{{ rm.marks }}" as="g" hint-placeholder-count="0">
            <path d="{{ g.d }}" fill="none" stroke="black" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" transform="{{ g.transform }}"></path>
          </sc-for>
        </mask>
      </sc-for>
    </defs>
    <sc-for list="{{ ops }}" as="op" hint-placeholder-count="5">
      <sc-if value="{{ op.isEllipse }}" hint-placeholder-val="{{ false }}">
        <ellipse cx="{{ op.cx }}" cy="{{ op.cy }}" rx="{{ op.rx }}" ry="{{ op.ry }}" fill="{{ op.fill }}" opacity="{{ op.opacity }}" transform="{{ op.transform }}" style="{{ op.style }}"></ellipse>
      </sc-if>
      <sc-if value="{{ op.isPath }}" hint-placeholder-val="{{ true }}">
        <path d="{{ op.d }}" fill="{{ op.fill }}" stroke="{{ op.stroke }}" stroke-width="{{ op.sw }}" stroke-linecap="{{ op.linecap }}" stroke-linejoin="round" stroke-dasharray="{{ op.dash }}" opacity="{{ op.opacity }}" transform="{{ op.transform }}" style="{{ op.style }}"></path>
      </sc-if>
      <sc-if value="{{ op.isLine }}" hint-placeholder-val="{{ false }}">
        <line x1="{{ op.x1 }}" y1="{{ op.y1 }}" x2="{{ op.x2 }}" y2="{{ op.y2 }}" stroke="{{ op.stroke }}" stroke-width="{{ op.sw }}" stroke-linecap="round" opacity="{{ op.opacity }}" style="{{ op.style }}"></line>
      </sc-if>
    </sc-for>
  </svg>
  <sc-for list="{{ spinLayers }}" as="sl" hint-placeholder-count="0">
    <svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" style="position:absolute;inset:0;overflow:visible;transform-origin:50% 50%;animation:archespin {{ sl.dur }} linear infinite {{ sl.dir }};">
      <sc-for list="{{ sl.ops }}" as="op" hint-placeholder-count="0">
        <sc-if value="{{ op.isEllipse }}" hint-placeholder-val="{{ false }}">
          <ellipse cx="{{ op.cx }}" cy="{{ op.cy }}" rx="{{ op.rx }}" ry="{{ op.ry }}" fill="{{ op.fill }}" opacity="{{ op.opacity }}" transform="{{ op.transform }}" style="{{ op.style }}"></ellipse>
        </sc-if>
        <sc-if value="{{ op.isPath }}" hint-placeholder-val="{{ true }}">
          <path d="{{ op.d }}" fill="{{ op.fill }}" stroke="{{ op.stroke }}" stroke-width="{{ op.sw }}" stroke-linecap="{{ op.linecap }}" stroke-linejoin="round" stroke-dasharray="{{ op.dash }}" opacity="{{ op.opacity }}" transform="{{ op.transform }}" style="{{ op.style }}"></path>
        </sc-if>
        <sc-if value="{{ op.isLine }}" hint-placeholder-val="{{ false }}">
          <line x1="{{ op.x1 }}" y1="{{ op.y1 }}" x2="{{ op.x2 }}" y2="{{ op.y2 }}" stroke="{{ op.stroke }}" stroke-width="{{ op.sw }}" stroke-linecap="round" opacity="{{ op.opacity }}" style="{{ op.style }}"></line>
        </sc-if>
      </sc-for>
    </svg>
  </sc-for>
  <sc-if value="{{ glyph.on }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
      <span style="{{ glyph.style }}">{{ glyph.char }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:160,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:40,&quot;max&quot;:340},&quot;arch&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;str&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;str&quot;,&quot;dex&quot;,&quot;wis&quot;,&quot;int&quot;,&quot;per&quot;,&quot;con&quot;]},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;well&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;well&quot;,&quot;gem&quot;,&quot;planet&quot;,&quot;geoicon&quot;,&quot;innercut&quot;,&quot;outer&quot;,&quot;teeth&quot;,&quot;lobes&quot;,&quot;notch&quot;,&quot;segring&quot;,&quot;facet&quot;]},&quot;allocated&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hue&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:210,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:360,&quot;step&quot;:1,&quot;section&quot;:&quot;Owner tint&quot;},&quot;chroma&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.14,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:0.2,&quot;step&quot;:0.01,&quot;section&quot;:&quot;Owner tint&quot;},&quot;weldK&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.88,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0.4,&quot;max&quot;:1.15,&quot;step&quot;:0.01,&quot;section&quot;:&quot;Shape&quot;},&quot;sigil&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Shape&quot;},&quot;sigilStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;shape&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;shape&quot;,&quot;astroid&quot;,&quot;star8&quot;,&quot;occult&quot;,&quot;rune&quot;,&quot;kanji&quot;],&quot;section&quot;:&quot;Shape&quot;},&quot;showGlyph&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Shape&quot;},&quot;rimStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;single&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;single&quot;,&quot;double&quot;],&quot;section&quot;:&quot;Shape&quot;},&quot;holder&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;bevel&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;bevel&quot;,&quot;facet&quot;],&quot;section&quot;:&quot;Shape&quot;},&quot;geomRimR&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:31.5,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:22,&quot;max&quot;:40,&quot;step&quot;:0.5,&quot;section&quot;:&quot;Base geometry&quot;},&quot;geomCrestR&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:27.5,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:18,&quot;max&quot;:36,&quot;step&quot;:0.5,&quot;section&quot;:&quot;Base geometry&quot;},&quot;geomPitR&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:23,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:14,&quot;max&quot;:30,&quot;step&quot;:0.5,&quot;section&quot;:&quot;Base geometry&quot;},&quot;geomDiscR&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:10,&quot;max&quot;:26,&quot;step&quot;:0.5,&quot;section&quot;:&quot;Base geometry&quot;},&quot;tintMix&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Metal &amp; glow&quot;},&quot;glowMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;hover&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;always&quot;,&quot;hover&quot;,&quot;pulse&quot;,&quot;sweep&quot;],&quot;section&quot;:&quot;Metal &amp; glow&quot;},&quot;glowAmt&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.55,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Metal &amp; glow&quot;},&quot;core&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;rings&quot;,&quot;cog&quot;,&quot;orbit&quot;,&quot;spikes&quot;,&quot;gimbal&quot;],&quot;section&quot;:&quot;Core presence&quot;},&quot;haloScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:4,&quot;step&quot;:0.1,&quot;section&quot;:&quot;Core presence&quot;},&quot;runeRing&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;single&quot;,&quot;double&quot;,&quot;triple&quot;],&quot;section&quot;:&quot;Core presence&quot;},&quot;runeRingStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;flush&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;flush&quot;,&quot;ornate&quot;,&quot;mixed&quot;],&quot;section&quot;:&quot;Core presence&quot;},&quot;runeRingBlend&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;cutout&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;cutout&quot;,&quot;ink&quot;,&quot;glow&quot;],&quot;section&quot;:&quot;Core presence&quot;},&quot;runeRingGlow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Core presence&quot;},&quot;runeRingFill&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Core presence&quot;},&quot;runeRingRuneGlow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Core presence&quot;},&quot;runeRingPad&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:0.6,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Core presence&quot;},&quot;runeRingGap&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;section&quot;:&quot;Core presence&quot;},&quot;runeRingSpacing&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:9,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:3,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;section&quot;:&quot;Core presence&quot;},&quot;stakeCap&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:3,&quot;section&quot;:&quot;Stake&quot;},&quot;stakeAlloc&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:3,&quot;section&quot;:&quot;Stake&quot;},&quot;stakeStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;chrome&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;chrome&quot;,&quot;pips&quot;,&quot;rims&quot;,&quot;unison&quot;,&quot;ticks&quot;,&quot;arc&quot;],&quot;section&quot;:&quot;Stake&quot;},&quot;rimProfile&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;smooth&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;smooth&quot;,&quot;stepped&quot;,&quot;grooved&quot;,&quot;terraced&quot;],&quot;section&quot;:&quot;Stake&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;hover&quot;,&quot;selected&quot;,&quot;targeted&quot;],&quot;section&quot;:&quot;State&quot;},&quot;hostile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;aura&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;spin&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;addonPlates&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Addons&quot;},&quot;addonFortify&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Addons&quot;},&quot;addonBridge&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Addons&quot;},&quot;addonLifeline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Addons&quot;},&quot;addonClamp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Addons&quot;},&quot;ports&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Addons&quot;},&quot;weld&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;inscribe&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;archTint&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  // style-hover (CSS pseudo-class) doesn't reliably pick up dynamically-computed values in this
  // runtime, so real hover is tracked as component state and applied via a plain style hole instead.
  state = { hovering: false };
  _onEnter = () => this.setState({ hovering: true });
  _onLeave = () => this.setState({ hovering: false });
  ARCH = {
    str:{ poly:3, rot:-90, n:3,  planet:'\u2642', label:'STR' },
    dex:{ poly:4, rot:-90, n:4,  planet:'\u263f', label:'DEX' },
    wis:{ poly:0, rot:0,   n:12, planet:'\u2609', label:'WIS' },
    int:{ poly:8, rot:-90, n:8,  planet:'\u2644', label:'INT' },
    per:{ poly:5, rot:-90, n:5,  planet:'\u263d', label:'PER' },
    con:{ poly:6, rot:-90, n:6,  planet:'\u2641', label:'CON' }
  };
  _uid = 'an' + Math.random().toString(36).slice(2,8);

  P(r,a){ const rad=a*Math.PI/180; return [50+r*Math.cos(rad), 50+r*Math.sin(rad)]; }
  fmt(pts,close){ return 'M '+pts.map((p,i)=>(i?'L ':'')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ')+(close===false?'':' Z'); }
  circle(r){ return `M ${(50-r).toFixed(2)} 50 A ${r} ${r} 0 1 0 ${(50+r).toFixed(2)} 50 A ${r} ${r} 0 1 0 ${(50-r).toFixed(2)} 50 Z`; }
  poly(r,n,rot){ const p=[]; for(let i=0;i<n;i++) p.push(this.P(r,rot+i*360/n)); return this.fmt(p); }
  star(rO,rI,n,rot){ const p=[]; for(let i=0;i<2*n;i++) p.push(this.P(i%2?rI:rO, rot+i*180/n)); return this.fmt(p); }
  radial(fn,s){ s=s||220; const p=[]; for(let i=0;i<s;i++){ const th=i/s*360; p.push(this.P(fn(th),th)); } return this.fmt(p); }
  arc(r,a0,a1){ const [x0,y0]=this.P(r,a0),[x1,y1]=this.P(r,a1); const lg=(a1-a0)>180?1:0; return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${lg} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }

  mk(o){ return Object.assign({isPath:false,isEllipse:false,isLine:false,d:'',fill:'none',stroke:'none',sw:0,linecap:'round',dash:'none',opacity:1,style:'',transform:'',cx:0,cy:0,rx:0,ry:0,x1:0,y1:0,x2:0,y2:0}, o); }
  F(d,fill,style,op){ return this.mk({isPath:true,d,fill,style:style||'',opacity:op==null?1:op}); }
  S(d,stroke,sw,style,op,dash){ return this.mk({isPath:true,d,stroke,sw,style:style||'',opacity:op==null?1:op,dash:dash||'none'}); }
  E(cx,cy,rx,ry,fill,style,op){ return this.mk({isEllipse:true,cx,cy,rx,ry,fill,style:style||'',opacity:op==null?1:op}); }
  L(x1,y1,x2,y2,stroke,sw,style,op){ return this.mk({isLine:true,x1,y1,x2,y2,stroke,sw,style:style||'',opacity:op==null?1:op}); }
  dot(cx,cy,r){ return `M ${(cx-r).toFixed(2)} ${cy.toFixed(2)} a ${r} ${r} 0 1 0 ${(2*r).toFixed(2)} 0 a ${r} ${r} 0 1 0 ${(-2*r).toFixed(2)} 0`; }

  // --- rim band: ring 0 is the untouched original bevel (identical to the un-staked look — the
  // default stays exactly as it always was). Each additional stake point ADDS a whole new concentric
  // ring OUTSIDE the crater, growing the node's actual footprint — filled rings are bold hue-tinted
  // chrome (brighter with each ring out), unfilled/potential rings sit thin, flat and dim so you can
  // see there's room to grow. This reads as real growth, not a decoration bolted on the side.
  ringBandOps(rOut, crest, profile, cap, alloc, aHue, tintMix){
    const ops=[];
    // ring 0 — original smooth bevel, unchanged
    ops.push(this.S(this.arc(rOut-1,22,158),'rgba(0,0,0,0.3)',3,'filter:blur(1.6px);'));
    ops.push(this.S(this.arc(rOut-1,202,338),'rgba(255,255,255,0.16)',2,'filter:blur(1px);'));
    ops.push(this.S(this.circle(crest),'rgba(255,255,255,0.32)',1.5,'filter:blur(0.4px);'));

    const n = Math.max(1, Math.round(cap));
    const ringW = profile==='terraced' ? 5.4 : profile==='stepped' ? 5.0 : profile==='grooved' ? 4.6 : 4.2;
    let edge = rOut;
    for(let i=1;i<n;i++){
      const rInner=edge, rOuterI=edge+ringW, rMid=(rInner+rOuterI)/2;
      const filled = i<alloc;
      if(filled){
        const litL=(0.62+i*0.07).toFixed(3), litC=(0.09+0.16*tintMix).toFixed(3);
        const hi=`oklch(${(0.9-0.015*i).toFixed(3)} ${(0.07+0.14*tintMix).toFixed(3)} ${aHue})`;
        const mid=`oklch(${litL} ${litC} ${aHue})`;
        const lo=`oklch(${(0.4-0.015*i).toFixed(3)} ${(0.05+0.1*tintMix).toFixed(3)} ${aHue})`;
        if(profile==='terraced'){
          ops.push(this.S(this.circle(rMid), mid, ringW*0.97, '', 1));
          ops.push(this.S(this.circle(rOuterI), 'rgba(255,255,255,0.4)', 1, '', 0.85));
          ops.push(this.S(this.circle(rInner), 'rgba(0,0,0,0.4)', 0.9, '', 0.55));
        } else if(profile==='stepped'){
          ops.push(this.S(this.circle(rMid), mid, ringW*0.92, '', 1));
          ops.push(this.S(this.arc(rMid,208,332), hi, ringW*0.4, '', 0.6));
          ops.push(this.S(this.circle(rOuterI), 'rgba(0,0,0,0.48)', 0.9, '', 0.75));
          ops.push(this.S(this.circle(rInner), 'rgba(255,255,255,0.22)', 0.7, '', 0.5));
        } else if(profile==='grooved'){
          ops.push(this.S(this.circle(rMid), mid, ringW*0.7, '', 1));
          ops.push(this.S(this.circle(rInner), 'rgba(0,0,0,0.6)', 0.9, '', 0.65));
          ops.push(this.S(this.circle(rOuterI), 'rgba(0,0,0,0.6)', 0.9, '', 0.65));

  // inks the glyphs on top as dark engraving; 'glow' keeps the ring solid and lights the glyphs on top
  // instead, so they read as the brightest part of the band. ringGlow/ringFill control the shared inner+
  // outer rim edges and the band's own strength together, so both edges always move in lockstep.
  runeRingBand(uid, idx, rMid, count, hue, dur, dir, style, blend, ringGlow, ringFill, runeGlow, runePad){

    // for cutout this is a blurred colored layer behind the crisp cut edges; can be cranked with fill low
    // for a "faint band, blazing runes" look.
    const glowOp = this.S(this.circle(rMid), `oklch(0.72 0.22 ${hue})`, sw+2+runeGlow*3, `${maskStyle}filter:blur(${(1.6+runeGlow*3.5).toFixed(1)}px);`, Math.min(1,0.15+runeGlow*0.75));

      ops.push(this.S(this.circle(rOuter+1.1), `oklch(${edgeL} 0.17 ${hue})`, edgeSw, `filter:drop-shadow(0 0 ${edgeBlur}px oklch(0.76 0.2 ${hue}));`, edgeOpacity));

      ops.push(this.S(this.circle(rInner-0.2), `oklch(${edgeL} 0.13 ${hue})`, edgeSw, `filter:drop-shadow(0 0 ${edgeBlur}px oklch(0.8 0.2 ${hue}));`, edgeOpacity*0.85));
    }

  // clusters raw angles that are close together (within maxGap degrees) into single wider spans,
  // so a clamp/etc addon can merge overlapping ports into one bigger fixture instead of colliding copies
  clusterAngles(angles, maxGap){
    if(!angles.length) return [];
    const norm=angles.map(a=>((a%360)+360)%360).sort((a,b)=>a-b);
    const clusters=[[norm[0]]];
    for(let i=1;i<norm.length;i++){
      const prev=clusters[clusters.length-1];
      if(norm[i]-prev[prev.length-1]<=maxGap) prev.push(norm[i]); else clusters.push([norm[i]]);
    }
    // wraparound: merge first/last cluster if they're adjacent across 0/360
    if(clusters.length>1){
      const first=clusters[0], last=clusters[clusters.length-1];
      if(360-last[last.length-1]+first[0]<=maxGap){ clusters[0]=last.concat(first); clusters.pop(); }
    }
    return clusters.map(c=>({ center: c.reduce((s,a)=>s+a,0)/c.length, span: Math.max(20, (c[c.length-1]-c[0])+16) }));
  }

      }
      // warning ring
      if(hostile) o.push(this.S(this.circle(29),'oklch(0.62 0.22 25)',2.4,'filter:drop-shadow(0 0 3px oklch(0.55 0.22 25));',1,'2.2 3.2'));
      // status fx
      const st=this.statusOps(status); st.stat.forEach(x=>o.push(x)); st.spin.forEach(x=>spin.push(x));
      const spinActive = spin.length>0 && (spinCore || status==='targeted');
      const spinDur = status==='targeted' ? '16s' : '24s';
      const auraCol = { mid: (aura && allocated) ? disk.mid : 'transparent' };
      const spinLayers = spinActive ? [{ops:spin, dur:spinDur, dir:'normal'}] : [];
      const wrapperStyle = `position:relative;width:${size}px;height:${size}px;transition:filter 0.2s ease;`
        + (this.state.hovering ? 'filter:brightness(1.08) drop-shadow(0 0 8px rgba(255,255,255,0.3));' : '');
      return { uid, size, disk:gemPal, aura:auraCol, metalG:metalUse, ops:o, spinLayers, runeMasks:[], glyph:{on:false,char:'',style:''}, wrapperStyle, onEnter:this._onEnter, onLeave:this._onLeave };
    }

    const metal='rgba(150,160,182,0.92)', metalDk='rgba(52,58,74,0.9)', neutral='rgba(210,218,235,0.32)';
    const ops=[];
    ops.push(this.E(50,70,15.5,4.2,'rgba(0,0,0,0.42)','filter:blur(2px);'));

    let diskD, isRound=true, rDisk=21;
    const polyShape=(r)=> A.poly>0 ? this.poly(r,A.poly,A.rot) : this.circle(r);

    if(variant==='planet'||variant==='geoicon'){
      rDisk=21; diskD=this.circle(rDisk);
      ops.push(this.S(this.circle(23),neutral,1.3));
    } else if(variant==='teeth'){
      rDisk=20; diskD=this.circle(rDisk);
      ops.push(this.F(this.radial(th=>22+5*(Math.cos((th-A.rot)*Math.PI/180*A.n)>=0?1:0)),metal));
      ops.push(this.S(this.circle(22),metalDk,0.6));
    } else if(variant==='lobes'){
      rDisk=20; diskD=this.circle(rDisk);
      ops.push(this.F(this.radial(th=>24+3*Math.cos((th-A.rot)*Math.PI/180*A.n)),metal));
    } else if(variant==='notch'){
      rDisk=21; diskD=this.circle(rDisk);
      ops.push(this.F(this.radial(th=>26-4.2*Math.pow(Math.max(0,Math.cos((th-A.rot)*Math.PI/180*A.n)),10)),metal));
    } else if(variant==='segring'){
      rDisk=21; diskD=this.circle(rDisk);
      const gap=A.n>6?14:22;
      for(let i=0;i<A.n;i++){ const a0=A.rot+i*360/A.n+gap/2, a1=A.rot+(i+1)*360/A.n-gap/2; ops.push(this.S(this.arc(24.5,a0,a1),metal,3.2)); }
    } else if(variant==='innercut'){
      rDisk=18.5; diskD=polyShape(rDisk); isRound=(A.poly===0);
      ops.push(this.S(this.circle(25),neutral,2.2));
      ops.push(this.S(this.circle(25),metalDk,0.6));
    } else if(variant==='outer'){
      rDisk=26; diskD=polyShape(rDisk); isRound=(A.poly===0);
    } else if(variant==='facet'){
      rDisk=23; diskD=polyShape(rDisk); isRound=(A.poly===0);
    }

    // disk fill + rim
    ops.push(this.F(diskD,`url(#${this._uid}-d)`));
    ops.push(this.S(diskD,disk.rim,1.3));
    // facet shading
    if(variant==='facet'){
      const n=A.poly||10;
      for(let i=0;i<n;i++){
        const [vx,vy]=this.P(rDisk,A.rot+i*360/n);
        ops.push(this.L(50,50,vx,vy,'rgba(255,255,255,0.13)',0.6));
        const [v2x,v2y]=this.P(rDisk,A.rot+(i+1)*360/n);
        ops.push(this.F(`M 50 50 L ${vx.toFixed(2)} ${vy.toFixed(2)} L ${v2x.toFixed(2)} ${v2y.toFixed(2)} Z`, i%2?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.1)'));
      }
    }
    // 3D shading
    ops.push(this.E(44.5,41,9.2,5,'rgba(255,255,255,0.32)','filter:blur(0.6px);',allocated?1:0.3));
    if(isRound) ops.push(this.S(this.arc(rDisk-1,22,158),'rgba(0,0,0,0.26)',3,'filter:blur(1px);'));
    ops.push(this.S(diskD,'rgba(255,255,255,0.22)',0.8));

    // geoicon layer
    if(variant==='geoicon') this.iconOps(arch).forEach(o=>ops.push(o));

    // hostile hazard ring
    if(hostile) ops.push(this.S(this.circle(29.5),'oklch(0.62 0.22 25)',2.4,'filter:drop-shadow(0 0 3px oklch(0.55 0.22 25));',1,'2.2 3.2'));

    const glyph = variant==='planet'
      ? { on:true, char:A.planet, style:`font-family:'Segoe UI Symbol','Noto Sans Symbols',serif;font-weight:700;font-size:${(size*0.3).toFixed(1)}px;color:rgba(14,17,25,0.6);text-shadow:0 1px 0 rgba(255,255,255,0.32);line-height:1;` }
      : { on:false, char:'', style:'' };

    const wrapperStyle = `position:relative;width:${size}px;height:${size}px;transition:filter 0.2s ease;`
      + (this.state.hovering ? 'filter:brightness(1.08) drop-shadow(0 0 8px rgba(255,255,255,0.3));' : '');
    return { uid:this._uid, size, disk, aura:{mid:'transparent'}, metalG:metalDefault, ops, spinLayers:[], runeMasks:[], glyph, wrapperStyle, onEnter:this._onEnter, onLeave:this._onLeave };
  }
}
</script>
